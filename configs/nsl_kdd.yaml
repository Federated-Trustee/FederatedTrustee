experiment_name: "nsl_kdd_v1"

dataset:
  name: "nsl_kdd"
  train_path: "data/raw/nsl_kdd/KDDTrain+.txt"
  test_path: "data/raw/nsl_kdd/KDDTest+.txt"
  target_mode: "binary_dos"

federated:
  num_clients: 10
  num_rounds: 3
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  local_epochs: 1

training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0

model:
  name: "mlp"
  hidden_dims: [512]
  dropout: 0.2
  num_classes: 2

runtime:
  seed: 42
  device: "cpu"

attack:
  enabled: true
  type: "label_flip"
  malicious_client_ids: [0, 1]
  source_label: 1
  target_label: 0
  flip_probability: 1.0

artifacts:
  run_dir: "runs"

trustee:
  enabled: true
  round_to_analyze: 3
  num_iter: 20
  num_stability_iter: 5
  samples_size: 0.3